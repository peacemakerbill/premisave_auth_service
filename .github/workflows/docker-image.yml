name: Docker image

# Builds the image on every pull request (nothing is published) and publishes it to GitHub Container Registry
# (ghcr.io) when a branch or a version tag is pushed:
#
#   develop branch   ghcr.io/<owner>/<repo>:development
#   staging branch   ghcr.io/<owner>/<repo>:staging
#   main branch      ghcr.io/<owner>/<repo>:production and :latest
#   tag v1.2.3       ghcr.io/<owner>/<repo>:1.2.3
#
# Every image is also tagged sha-<commit>. Platforms that can pull a registry image (Render image service,
# Coolify "Docker Image", Fly.io, a server running docker compose) can deploy these tags directly.

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
