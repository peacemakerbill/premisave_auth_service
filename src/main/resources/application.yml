spring:
  application:
    name: auth-service

  # ── Data Stores ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false  # Prevents Redis from claiming MongoDB repositories

  # ── MongoDB (Boot 4: spring.mongodb, not spring.data.mongodb) ──
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-auth}

  # ── Mail (Gmail SMTP) ──
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME:thepeacemakerske@gmail.com}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ── File Upload ──
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    discovery:
      enabled: false

# ── Server ──
server:
  port: 8080

# ── Application URLs ──
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

backend:
  url: ${BACKEND_URL:http://localhost:8080}

# ── OAuth2 Credentials ──
# Every provider below is OPTIONAL and independent: leave its variables
# unset (or delete them from .env) and the service still starts — that
# one provider is simply unavailable via POST /auth/oauth until it is
# configured. A blank default here is required for that: it guarantees
# these placeholders always resolve, so a missing credential can never
# by itself fail application startup.
# Google:   https://console.cloud.google.com (APIs & Services, Credentials, Create OAuth 2.0 Client ID)
#           (comma-separate several client IDs, e.g. web-id,android-id,ios-id)
# Facebook: https://developers.facebook.com (My Apps, Add App, Facebook Login)
# GitHub:   https://github.com/settings/developers (OAuth Apps, New OAuth App)
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  facebook:
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}

# ── External Services ──
# No defaults: these are real account credentials and must come from
# .env or the environment. Required — profile-picture upload and social
# sign-in picture import fail to start without them.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ── JWT ──
# No default secret: every Premisave service that validates these tokens
# must share the exact same JWT_SECRET, so a hardcoded fallback here would
# either leak (if committed) or silently diverge from the other services.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:2592000000}

# ── Rate Limiting ──
rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:20}

# ── Email ──
email:
  support: ${SUPPORT_EMAIL:thepeacemakerske@gmail.com}

# ── Profile Views ──
profile-views:
  max-history-size: 20

# ── API Key (public endpoints guard) ──
# Generate with: openssl rand -hex 32
# No default: must be identical to INTERNAL_API_KEY in the wallet service
# and any other service calling this one's /internal/** endpoints.
app:
  api-key: ${API_KEY}

  # ── Account security: administrators, devices, sessions, sign-in alerts ──
  # Every value has a default, so a missing or empty variable never stops startup.
  # Values are read at startup: after changing them in .env or the environment, restart the service.
  security:
    # Comma-separated. Trimmed, lower-cased, validated and de-duplicated; invalid entries are skipped and logged.
    # INITIAL: provisioned at startup (existing verified users are promoted; missing ones get an invitation email).
    # AUTO:    becomes ADMIN once the account's email is verified (registration, sign-in, social login).
    # Removing an address here never demotes an existing admin; use PUT /admin/users/change-role/{id} (audited).
    initial-admin-emails: ${INITIAL_ADMIN_EMAILS:}
    auto-admin-emails: ${AUTO_ADMIN_EMAILS:}
    invitation-ttl-hours: ${SECURITY_INVITATION_TTL_HOURS:72}

    # Email alerts
    login-email-notifications: ${SECURITY_LOGIN_EMAIL_NOTIFICATIONS:true}
    new-device-alerts: ${SECURITY_NEW_DEVICE_ALERTS:true}
    suspicious-login-alerts: ${SECURITY_SUSPICIOUS_LOGIN_ALERTS:true}
    device-alert-cooldown-hours: ${SECURITY_DEVICE_ALERT_COOLDOWN_HOURS:24}
    alert-first-device: ${SECURITY_ALERT_FIRST_DEVICE:false}
    display-zone: ${SECURITY_DISPLAY_ZONE:UTC}
    security-page-path: ${SECURITY_PAGE_PATH:/account/security}

    # Devices and sessions
    device-trust-enabled: ${SECURITY_DEVICE_TRUST_ENABLED:true}
    session-revocation-enabled: ${SECURITY_SESSION_REVOCATION_ENABLED:true}
    device-cookie-name: ${SECURITY_DEVICE_COOKIE_NAME:ps_did}
    # Set to false only for plain-http local development
    device-cookie-secure: ${SECURITY_DEVICE_COOKIE_SECURE:true}
    device-cookie-same-site: ${SECURITY_DEVICE_COOKIE_SAME_SITE:Lax}
    device-cookie-max-age-days: ${SECURITY_DEVICE_COOKIE_MAX_AGE_DAYS:365}
    max-devices-per-user: ${SECURITY_MAX_DEVICES_PER_USER:50}
    session-ttl-days: ${SECURITY_SESSION_TTL_DAYS:30}
    reauth-window-minutes: ${SECURITY_REAUTH_WINDOW_MINUTES:10}
    # Lifetime of access tokens in minutes. 0 keeps jwt.expiration (about 30 days) so current clients keep working.
    # Recommended 15 to 60 once clients use the refresh token: a revoked session then stops working everywhere,
    # including in services that only check the token signature, within that time.
    access-token-minutes: ${SECURITY_ACCESS_TOKEN_MINUTES:0}
    # true: POST /auth/signup answers the same for new and already-registered emails (202, no tokens), and the
    # existing owner is told by email. false keeps the current response, which says "Email already exists".
    hide-existing-accounts: ${SECURITY_HIDE_EXISTING_ACCOUNTS:false}
    # Accept an unexpired access token at POST /auth/refresh (older clients). Set false once clients use refresh tokens.
    legacy-refresh-enabled: ${SECURITY_LEGACY_REFRESH_ENABLED:true}

    # Network. Only addresses listed here may supply X-Forwarded-For (IPs or CIDR ranges, comma-separated).
    trusted-proxies: ${SECURITY_TRUSTED_PROXIES:}
    # Off by default: lookups send visitor IPs to the provider in ip-geolocation-url. Location is approximate.
    ip-geolocation-enabled: ${SECURITY_IP_GEOLOCATION_ENABLED:false}
    ip-geolocation-url: ${SECURITY_IP_GEOLOCATION_URL:https://ipwho.is/{ip}}
    ip-geolocation-timeout-ms: ${SECURITY_IP_GEOLOCATION_TIMEOUT_MS:2000}

    # Retention
    audit-retention-days: ${SECURITY_AUDIT_RETENTION_DAYS:180}
    device-retention-days: ${SECURITY_DEVICE_RETENTION_DAYS:365}

    # Brute force protection (temporary, progressive locks; they expire on their own)
    login-max-failures: ${SECURITY_LOGIN_MAX_FAILURES:5}
    login-failure-window-minutes: ${SECURITY_LOGIN_FAILURE_WINDOW_MINUTES:15}
    login-lockout-minutes: ${SECURITY_LOGIN_LOCKOUT_MINUTES:15}
    login-max-lockout-minutes: ${SECURITY_LOGIN_MAX_LOCKOUT_MINUTES:240}
    ip-max-failures: ${SECURITY_IP_MAX_FAILURES:30}
    ip-max-distinct-accounts: ${SECURITY_IP_MAX_DISTINCT_ACCOUNTS:10}
    ip-window-minutes: ${SECURITY_IP_WINDOW_MINUTES:15}

    # Suspicious sign-in scoring (alert threshold out of 100; nothing is blocked automatically)
    risk-alert-threshold: ${SECURITY_RISK_ALERT_THRESHOLD:50}
    location-change-window-hours: ${SECURITY_LOCATION_CHANGE_WINDOW_HOURS:12}
    frequency-threshold: ${SECURITY_FREQUENCY_THRESHOLD:8}
    frequency-window-minutes: ${SECURITY_FREQUENCY_WINDOW_MINUTES:10}
    distinct-ip-threshold: ${SECURITY_DISTINCT_IP_THRESHOLD:4}
    distinct-ip-window-minutes: ${SECURITY_DISTINCT_IP_WINDOW_MINUTES:60}

    # "This was not me" links in emails
    action-token-ttl-minutes: ${SECURITY_ACTION_TOKEN_TTL_MINUTES:1440}
    # Cron for the daily retention clean-up
    retention-cron: ${SECURITY_RETENTION_CRON:0 15 3 * * *}

  # ── Administrators created at startup from ADMIN1_*, ADMIN2_*, ADMIN3_* ──
  # Nothing here has a usable default: a slot with no values is simply unused, and no password exists
  # in the source code. Passwords must come from .env or the environment (never commit them).
  # An account is only ever CREATED here. An existing account's password and details are never overwritten,
  # and nobody is demoted. Sign-in is by EMAIL, so each used slot needs ADMINn_EMAIL; the username is a handle.
  # Values are read at startup; after the first sign-in, change the password and remove it from .env.
  admins:
    enabled: ${ADMINS_ENABLED:true}
    # true: an invalid slot stops startup. false: it is skipped, the reason is logged (never the value).
    strict: ${ADMINS_STRICT:false}
    # true: an existing VERIFIED, active, non-admin account with the same email is promoted to ADMIN.
    # false (default): it is left alone and a warning is logged, so configuration alone never escalates an account.
    promote-existing: ${ADMINS_PROMOTE_EXISTING:false}
    # Never lower than 8, whatever is set here.
    min-password-length: ${ADMINS_MIN_PASSWORD_LENGTH:8}
    admin1:
      email: ${ADMIN1_EMAIL:}
      username: ${ADMIN1_USERNAME:}
      first-name: ${ADMIN1_FIRST_NAME:}
      middle-name: ${ADMIN1_MIDDLE_NAME:}
      last-name: ${ADMIN1_LAST_NAME:}
      password: ${ADMIN1_PASSWORD:}
    admin2:
      email: ${ADMIN2_EMAIL:}
      username: ${ADMIN2_USERNAME:}
      first-name: ${ADMIN2_FIRST_NAME:}
      middle-name: ${ADMIN2_MIDDLE_NAME:}
      last-name: ${ADMIN2_LAST_NAME:}
      password: ${ADMIN2_PASSWORD:}
    admin3:
      email: ${ADMIN3_EMAIL:}
      username: ${ADMIN3_USERNAME:}
      first-name: ${ADMIN3_FIRST_NAME:}
      middle-name: ${ADMIN3_MIDDLE_NAME:}
      last-name: ${ADMIN3_LAST_NAME:}
      password: ${ADMIN3_PASSWORD:}

  # ── Document storage (Home Owner application files) ──
  # Files are kept on a disk, never in the database and never in a third-party service.
  #   LOCAL    a directory on this server (default)
  #   NETWORK  a network share, for example a Synology NAS, mounted by the operating system at
  #            network.mount-path (SMB/CIFS or NFS). The NAS login belongs to the mount (a root-only
  #            credentials file), so this application never holds a NAS username or password.
  # Nothing is required at startup: with an unusable location the service still boots and uploads
  # answer 503 until it is fixed, unless fail-on-unavailable is true.
  storage:
    type: ${STORAGE_TYPE:LOCAL}
    create-directories: ${STORAGE_CREATE_DIRECTORIES:true}
    fail-on-unavailable: ${STORAGE_FAIL_ON_UNAVAILABLE:false}
    # Uploads are refused when less than this much space is free (0 turns the check off)
    min-free-mb: ${STORAGE_MIN_FREE_MB:100}
    local:
      # Set STORAGE_LOCAL_PATH in .env. No path is written here. If it is left unset or blank, the code uses
      # ~/premisave-file-storage/homeowner-onboarding (inside the home directory of the user running the service).
      path: ${STORAGE_LOCAL_PATH:}
    network:
      protocol: ${STORAGE_NETWORK_PROTOCOL:SMB}
      # IP address or host name of the NAS. Used to check that the right share is mounted, never to connect.
      host: ${STORAGE_NETWORK_HOST:}
      # SMB: the share name. NFS: the exported path, for example /volume1/premisave
      share: ${STORAGE_NETWORK_SHARE:}
      mount-path: ${STORAGE_NETWORK_MOUNT_PATH:/mnt/premisave-nas}
      # Folder inside the share that holds the documents
      directory: ${STORAGE_NETWORK_DIRECTORY:homeowner-onboarding}
      # true: refuse to write unless the share is really mounted (otherwise files land on the local disk)
      require-mount: ${STORAGE_NETWORK_REQUIRE_MOUNT:true}

# ── Home Owner applications ──
home-owner-application:
  max-file-size-mb: ${HOME_OWNER_MAX_FILE_SIZE_MB:8}
  max-documents: ${HOME_OWNER_MAX_DOCUMENTS:25}
  review-sla-days: ${HOME_OWNER_REVIEW_SLA_DAYS:3}
  # How many times a rejected application may be reopened for corrections. 0 turns reapplying off.
  max-reapplications: ${HOME_OWNER_MAX_REAPPLICATIONS:3}
  frontend-path: ${HOME_OWNER_FRONTEND_PATH:/home-owner/application}

# ── Logging ──
logging:
  level:
    "[com.premisave.auth]": DEBUG
    "[org.springframework.data.mongodb]": DEBUG
    "[org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport]": ERROR
    "[org.springframework.cloud.commons.util.InetUtils]": ERROR