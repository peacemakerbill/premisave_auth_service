spring:
  application:
    name: auth-service

  # ── Data Stores ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false  # Prevents Redis from claiming MongoDB repositories

  # ── MongoDB (Boot 4: spring.mongodb, not spring.data.mongodb) ──
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-auth}

  # ── Mail (Gmail SMTP) ──
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME:thepeacemakerske@gmail.com}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ── File Upload ──
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    discovery:
      enabled: false

# ── Server ──
server:
  port: 8080

# ── Application URLs ──
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

backend:
  url: ${BACKEND_URL:http://localhost:8080}

# ── OAuth2 Credentials ──
# Google: https://console.cloud.google.com  → APIs & Services → Credentials → Create OAuth 2.0 Client ID
# Facebook: https://developers.facebook.com → My Apps → Add App → Facebook Login
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
  facebook:
    app-id: ${FACEBOOK_APP_ID:YOUR_FACEBOOK_APP_ID}
    app-secret: ${FACEBOOK_APP_SECRET:YOUR_FACEBOOK_APP_SECRET}

# ── External Services ──
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:thepeacemakersllc}
  api-key: ${CLOUDINARY_API_KEY:929659223288334}
  api-secret: ${CLOUDINARY_API_SECRET:nAsBdgfXx86u7-Y8X2VnLa-2FbQ}

# ── JWT ──
jwt:
  secret: ${JWT_SECRET:eW91ci12ZXJ5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
  expiration: ${JWT_EXPIRATION:2592000000}

# ── Rate Limiting ──
rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:20}

# ── Email ──
email:
  support: ${SUPPORT_EMAIL:thepeacemakerske@gmail.com}

# ── Profile Views ──
profile-views:
  max-history-size: 20

# ── API Key (public endpoints guard) ──
# Generate with: openssl rand -hex 32
# Set via environment variable in production — never commit the real value.
app:
  api-key: ${API_KEY:00183e19c295366cf171c0d449d8b5ca46291573c9d1643e1e441b0bf571d1c7}

# ── Logging ──
logging:
  level:
    "[com.premisave.auth]": DEBUG
    "[org.springframework.data.mongodb]": DEBUG
    "[org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport]": ERROR
    "[org.springframework.cloud.commons.util.InetUtils]": ERROR