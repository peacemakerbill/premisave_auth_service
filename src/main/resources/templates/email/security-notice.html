<h1 style="margin:0 0 12px;font-size:22px;color:#111827;">{{title}}</h1>
<p style="margin:0 0 12px;">Hi {{name}},</p>
<p style="margin:0 0 12px;">{{intro}}</p>
{{{detailsHtml}}}
{{#warning}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;background-color:#fffbeb;border:1px solid #fcd34d;border-radius:8px;">
  <tr><td style="padding:14px 16px;font-size:14px;color:#92400e;">{{warning}}</td></tr>
</table>
{{/warning}}
{{#buttonUrl}}
<table role="presentation" class="btn" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
  <tr><td style="background-color:#0f766e;border-radius:8px;">
    <a href="{{buttonUrl}}" style="display:inline-block;padding:12px 22px;color:#ffffff;font-weight:600;text-decoration:none;font-size:15px;">{{buttonLabel}}</a>
  </td></tr>
</table>
{{/buttonUrl}}
