<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>{{appName}}</title>
  <style>
    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 20px !important; padding-right: 20px !important; }
      .btn a { display: block !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td class="px" style="background-color:#0f766e;padding:22px 32px;color:#ffffff;font-size:20px;font-weight:700;letter-spacing:0.3px;">
              {{appName}}
            </td>
          </tr>
          <tr>
            <td class="px" style="padding:32px;font-size:15px;line-height:1.6;color:#374151;">
              {{{body}}}
            </td>
          </tr>
          <tr>
            <td class="px" style="padding:20px 32px;background-color:#f9fafb;border-top:1px solid #e5e7eb;font-size:12px;line-height:1.5;color:#6b7280;">
              This is an automated security message from {{appName}}. We never ask for your password or verification codes by email.<br>
              Questions? Contact <a href="mailto:{{supportEmail}}" style="color:#0f766e;">{{supportEmail}}</a><br>
              &copy; {{year}} {{appName}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
